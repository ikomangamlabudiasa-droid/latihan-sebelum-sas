<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis SAS TIK - Kelas 12</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
    padding: 30px 25px;
    text-align: center;
  }
  header h1 { font-size: 1.6em; margin-bottom: 6px; }
  header p { opacity: 0.9; font-size: 0.95em; }

  .section { padding: 25px 30px; }

  /* ===== FORM IDENTITAS ===== */
  .identity-form label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    color: #4f46e5;
  }
  .identity-form input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 1em;
    margin-bottom: 18px;
    transition: border 0.2s;
  }
  .identity-form input:focus {
    outline: none;
    border-color: #7c3aed;
  }

  .btn {
    display: inline-block;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
    border: none;
    padding: 14px 32px;
    font-size: 1.05em;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    width: 100%;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(79,70,229,0.4);
  }
  .btn:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .btn-secondary {
    background: #6b7280;
  }
  .btn-secondary:hover { box-shadow: 0 8px 20px rgba(107,114,128,0.4); }

  /* ===== SOAL ===== */
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 15px 30px;
    background: #f3f4f6;
    border-bottom: 1px solid #e5e7eb;
  }
  .quiz-header .student-info { font-weight: 600; color: #4f46e5; }
  .progress-text { font-size: 0.9em; color: #6b7280; }

  .progress-bar {
    height: 6px;
    background: #e5e7eb;
    width: 100%;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    width: 0%;
    transition: width 0.3s;
  }

  .question-card {
    padding: 25px 30px;
    border-bottom: 1px solid #eee;
  }
  .question-card:last-of-type { border-bottom: none; }

  .q-number {
    display: inline-block;
    background: #eef2ff;
    color: #4f46e5;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.85em;
    margin-bottom: 12px;
  }
  .q-text {
    font-weight: 600;
    font-size: 1.05em;
    margin-bottom: 15px;
    line-height: 1.5;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 15px;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    background: #fafafa;
  }
  .option:hover { border-color: #a5b4fc; background: #f5f3ff; }
  .option input { margin-top: 3px; accent-color: #7c3aed; cursor: pointer; }
  .option.selected { border-color: #7c3aed; background: #f5f3ff; }

  /* ===== HASIL ===== */
  .result-box {
    text-align: center;
    padding: 35px 25px;
  }
  .score-circle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    box-shadow: 0 10px 30px rgba(79,70,229,0.4);
  }
  .score-circle .score-num { font-size: 2.6em; font-weight: 800; line-height: 1; }
  .score-circle .score-label { font-size: 0.8em; opacity: 0.9; margin-top: 4px; }

  .result-summary {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    margin: 20px 0 10px;
  }
  .stat {
    padding: 12px 24px;
    border-radius: 10px;
    font-weight: 600;
  }
  .stat.correct { background: #dcfce7; color: #166534; }
  .stat.wrong { background: #fee2e2; color: #991b1b; }
  .stat.empty { background: #fef9c3; color: #854d0e; }

  .result-message {
    font-size: 1.1em;
    font-weight: 600;
    margin: 15px 0 25px;
    padding: 15px;
    border-radius: 10px;
    background: #f3f4f6;
  }

  .review-title {
    text-align: left;
    font-weight: 700;
    font-size: 1.1em;
    margin: 25px 0 12px;
    color: #4f46e5;
  }
  .review-item {
    text-align: left;
    padding: 12px 15px;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 0.92em;
    line-height: 1.5;
  }
  .review-item.correct { background: #f0fdf4; border-left: 4px solid #22c55e; }
  .review-item.wrong { background: #fef2f2; border-left: 4px solid #ef4444; }
  .review-item.empty { background: #fefce8; border-left: 4px solid #eab308; }
  .review-item .r-q { font-weight: 600; margin-bottom: 4px; }
  .review-item .r-detail { color: #555; }
  .review-item .r-detail span.ans-user { color: #ef4444; font-weight: 600; }
  .review-item .r-detail span.ans-key { color: #22c55e; font-weight: 600; }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .section { padding: 20px 18px; }
    .question-card { padding: 20px 18px; }
    .quiz-header { padding: 12px 18px; }
    header h1 { font-size: 1.3em; }
    .result-summary { gap: 12px; }
    .stat { padding: 10px 16px; font-size: 0.9em; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📝 Sumatif Akhir Semester Ganjil</h1>
    <p>Mata Pelajaran TIK — Kelas 10</p>
  </header>

  <!-- ===== FORM IDENTITAS ===== -->
  <div id="identitySection" class="section">
    <form class="identity-form" id="identityForm">
      <label for="nama">Nama Lengkap</label>
      <input type="text" id="nama" placeholder="Masukkan nama lengkap Anda" required>

      <label for="absen">Nomor Absen</label>
      <input type="number" id="absen" placeholder="Masukkan nomor absen" min="1" max="50" required>

      <button type="submit" class="btn">Mulai Mengerjakan Kuis ➜</button>
    </form>
  </div>

  <!-- ===== QUIZ ===== -->
  <div id="quizSection" class="hidden">
    <div class="quiz-header">
      <div class="student-info" id="studentInfo"></div>
      <div class="progress-text" id="progressText"></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="questionsContainer"></div>
    <div class="section">
      <button id="submitBtn" class="btn">Selesai & Lihat Hasil ✔</button>
    </div>
  </div>

  <!-- ===== HASIL ===== -->
  <div id="resultSection" class="hidden">
    <div class="result-box">
      <div class="score-circle">
        <div class="score-num" id="finalScore">0</div>
        <div class="score-label">SKOR</div>
      </div>

      <div class="result-summary">
        <div class="stat correct">Benar: <span id="countCorrect">0</span></div>
        <div class="stat wrong">Salah: <span id="countWrong">0</span></div>
        <div class="stat empty">Kosong: <span id="countEmpty">0</span></div>
      </div>

      <div class="result-message" id="resultMessage"></div>

      <div class="review-title">🔍 Review Jawaban</div>
      <div id="reviewContainer"></div>

      <div style="margin-top:25px;">
        <button class="btn btn-secondary" onclick="location.reload()">Ulangi Kuis</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= DATA SOAL ================= */
const questions = [
  { q: "Microsoft Excel merupakan aplikasi yang banyak digunakan untuk ....",
    opts: ["Mengedit video", "Mengolah data dan angka", "Membuat animasi 3D", "Mengedit suara", "Mendesain bangunan"], ans: 1 },
  { q: "Fungsi rumus VLOOKUP pada Microsoft Excel adalah ....",
    opts: ["Menjumlahkan data", "Mencari data secara vertikal berdasarkan kolom pertama tabel", "Menghitung rata-rata", "Mencari nilai terkecil", "Menghapus data ganda"], ans: 1 },
  { q: "Rumus Excel yang digunakan untuk menghitung jumlah sel berdasarkan kriteria tertentu adalah ....",
    opts: ["SUM", "MAX", "COUNTIF", "AVERAGE", "MIN"], ans: 2 },
  { q: "Perhatikan rumus berikut: =SUM(B2:B10). Fungsi rumus tersebut adalah ....",
    opts: ["Menghitung rata-rata data", "Menjumlahkan data dari B2 sampai B10", "Mencari nilai terbesar", "Mencari nilai terkecil", "Menghitung jumlah teks"], ans: 1 },
  { q: "Fungsi IF pada Microsoft Excel digunakan untuk ....",
    opts: ["Membuat grafik", "Mengurutkan data", "Menguji kondisi tertentu dan menghasilkan nilai berdasarkan kondisi", "Menghapus tabel", "Menggabungkan beberapa file"], ans: 2 },
  { q: "Fitur Conditional Formatting pada Excel digunakan untuk ....",
    opts: ["Mengubah format sel secara otomatis berdasarkan kondisi tertentu", "Menghapus seluruh data", "Membuat dokumen baru", "Mengunci komputer", "Mengubah file menjadi video"], ans: 0 },
  { q: "Fungsi Pivot Table pada Microsoft Excel adalah ....",
    opts: ["Mengedit gambar", "Meringkas dan menganalisis data dalam jumlah besar", "Membuat animasi", "Menghapus rumus", "Mengubah ukuran halaman"], ans: 1 },
  { q: "Fungsi Freeze Panes pada Microsoft Excel adalah ....",
    opts: ["Menghapus baris", "Mengunci tampilan baris atau kolom agar tetap terlihat saat menggulir lembar kerja", "Menghapus kolom", "Mengubah warna tabel", "Menggabungkan sel"], ans: 1 },
  { q: "Rumus yang digunakan untuk mencari nilai rata-rata dari sel C2 sampai C20 adalah ....",
    opts: ["=SUM(C2:C20)", "=MAX(C2:C20)", "=AVERAGE(C2:C20)", "=MIN(C2:C20)", "=COUNT(C2:C20)"], ans: 2 },
  { q: "Fungsi Remove Duplicates pada Microsoft Excel digunakan untuk ....",
    opts: ["Menghapus data yang sama atau duplikat", "Menambah data baru", "Mengubah warna tabel", "Membuat grafik", "Menyalin data"], ans: 0 },
  { q: "Dalam Microsoft Word, fitur Table of Contents digunakan untuk ....",
    opts: ["Membuat daftar gambar", "Membuat daftar isi secara otomatis", "Menghapus halaman", "Membuat tabel angka", "Mengubah jenis huruf"], ans: 1 },
  { q: "Fitur Mail Merge pada Microsoft Word sangat berguna untuk ....",
    opts: ["Membuat surat undangan atau dokumen massal dengan data penerima berbeda", "Mengedit video", "Membuat animasi", "Menghitung nilai siswa", "Membuat grafik"], ans: 0 },
  { q: "Fungsi fitur Track Changes pada Microsoft Word adalah ....",
    opts: ["Menghapus seluruh dokumen", "Melacak perubahan atau revisi yang dilakukan pada dokumen", "Mengubah ukuran kertas", "Menambahkan gambar", "Mengunci keyboard"], ans: 1 },
  { q: "Format file yang digunakan untuk menyimpan dokumen Microsoft Word adalah ....",
    opts: [".xlsx", ".pptx", ".docx", ".mp4", ".png"], ans: 2 },
  { q: "Fitur References pada Microsoft Word digunakan untuk ....",
    opts: ["Mengatur referensi, kutipan, catatan kaki, dan daftar pustaka", "Mengatur volume komputer", "Mengedit gambar", "Menghapus tabel", "Membuat animasi"], ans: 0 },
  { q: "Dalam Microsoft PowerPoint, fitur Slide Master digunakan untuk ....",
    opts: ["Menghapus presentasi", "Mengatur desain dan format seluruh slide secara konsisten", "Menghitung jumlah slide", "Membuat rumus matematika", "Mengedit suara"], ans: 1 },
  { q: "Fitur Hyperlink pada PowerPoint berfungsi untuk ....",
    opts: ["Menghubungkan teks atau objek ke halaman, file, atau alamat web tertentu", "Menghapus slide", "Mengubah ukuran gambar", "Membuat tabel otomatis", "Mengatur ukuran huruf"], ans: 0 },
  { q: "Salah satu prinsip desain presentasi yang profesional adalah ....",
    opts: ["Menggunakan teks sebanyak mungkin", "Menggunakan warna yang bertabrakan", "Menampilkan informasi secara ringkas, jelas, dan terstruktur", "Menggunakan ukuran huruf sangat kecil", "Menggunakan animasi berlebihan"], ans: 2 },
  { q: "Ekstensi file standar Microsoft Excel adalah ....",
    opts: [".docx", ".pptx", ".xlsx", ".jpg", ".mp3"], ans: 2 },
  { q: "Fungsi utama Microsoft Access adalah ....",
    opts: ["Mengolah video", "Mengelola basis data (database)", "Membuat presentasi", "Mengedit foto", "Mengolah suara"], ans: 1 },
  { q: "Istilah Cloud Computing mengacu pada ....",
    opts: ["Penyimpanan dan pengolahan data melalui layanan komputasi berbasis internet", "Penyimpanan data hanya di kertas", "Penggunaan komputer tanpa listrik", "Penghapusan seluruh data", "Penggunaan komputer tanpa sistem operasi"], ans: 0 },
  { q: "Contoh layanan penyimpanan data berbasis cloud adalah ....",
    opts: ["Microsoft Paint", "Google Drive", "Notepad", "Calculator", "Windows Media Player"], ans: 1 },
  { q: "Tindakan mengirimkan tautan atau pesan palsu untuk mencuri informasi pribadi disebut ....",
    opts: ["Browsing", "Downloading", "Phishing", "Uploading", "Formatting"], ans: 2 },
  { q: "Salah satu cara melindungi data penting dalam komputer adalah ....",
    opts: ["Membagikan kata sandi kepada orang lain", "Menggunakan kata sandi yang kuat dan melakukan pencadangan data", "Membuka semua tautan yang diterima", "Menonaktifkan semua perlindungan keamanan", "Menggunakan komputer tanpa antivirus"], ans: 1 },
  { q: "Kemampuan untuk mengidentifikasi, mengevaluasi, dan menggunakan informasi digital secara bijak disebut ....",
    opts: ["Literasi digital", "Desain grafis", "Pemrograman", "Animasi digital", "Komunikasi manual"], ans: 0 }
];

const letters = ["A", "B", "C", "D", "E"];
const userAnswers = new Array(questions.length).fill(null);
let student = { nama: "", absen: "" };

/* ================= RENDER SOAL ================= */
function renderQuestions() {
  const container = document.getElementById("questionsContainer");
  container.innerHTML = "";

  questions.forEach((item, idx) => {
    const card = document.createElement("div");
    card.className = "question-card";

    const num = document.createElement("div");
    num.className = "q-number";
    num.textContent = `Soal ${idx + 1}`;

    const qText = document.createElement("div");
    qText.className = "q-text";
    qText.textContent = item.q;

    const opts = document.createElement("div");
    opts.className = "options";

    item.opts.forEach((opt, oIdx) => {
      const label = document.createElement("label");
      label.className = "option";
      label.innerHTML = `
        <input type="radio" name="q${idx}" value="${oIdx}">
        <span><strong>${letters[oIdx]}.</strong> ${opt}</span>
      `;

      const radio = label.querySelector("input");
      radio.addEventListener("change", () => {
        userAnswers[idx] = oIdx;
        // update selected style
        opts.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
        label.classList.add("selected");
        updateProgress();
      });

      opts.appendChild(label);
    });

    card.appendChild(num);
    card.appendChild(qText);
    card.appendChild(opts);
    container.appendChild(card);
  });

  updateProgress();
}

/* ================= PROGRESS ================= */
function updateProgress() {
  const answered = userAnswers.filter(a => a !== null).length;
  const pct = Math.round((answered / questions.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent =
    `Terjawab: ${answered} / ${questions.length} soal (${pct}%)`;
}

/* ================= SUBMIT ================= */
function submitQuiz() {
  const unanswered = userAnswers.filter(a => a === null).length;
  if (unanswered > 0) {
    const confirmSubmit = confirm(
      `Masih ada ${unanswered} soal yang belum dijawab. Yakin ingin menyelesaikan kuis?`
    );
    if (!confirmSubmit) return;
  }

  let correct = 0, wrong = 0, empty = 0;
  const reviewContainer = document.getElementById("reviewContainer");
  reviewContainer.innerHTML = "";

  questions.forEach((item, idx) => {
    const userAns = userAnswers[idx];
    const isCorrect = userAns === item.ans;
    const isEmpty = userAns === null;

    if (isCorrect) correct++;
    else if (isEmpty) empty++;
    else wrong++;

    const div = document.createElement("div");
    div.className = "review-item " + (isCorrect ? "correct" : isEmpty ? "empty" : "wrong");

    const userAnswerText = isEmpty
      ? "<em>Tidak dijawab</em>"
      : `${letters[userAns]}. ${item.opts[userAns]}`;
    const keyAnswerText = `${letters[item.ans]}. ${item.opts[item.ans]}`;

    div.innerHTML = `
      <div class="r-q">Soal ${idx + 1}: ${item.q}</div>
      <div class="r-detail">
        Jawaban Anda: <span class="ans-user">${userAnswerText}</span><br>
        Kunci Jawaban: <span class="ans-key">${keyAnswerText}</span>
        ${isCorrect ? " ✅" : isEmpty ? " ⚠️" : " ❌"}
      </div>
    `;
    reviewContainer.appendChild(div);
  });

  const score = Math.round((correct / questions.length) * 100);
  document.getElementById("finalScore").textContent = score;
  document.getElementById("countCorrect").textContent = correct;
  document.getElementById("countWrong").textContent = wrong;
  document.getElementById("countEmpty").textContent = empty;

  const msg = document.getElementById("resultMessage");
  let message = "";
  if (score >= 90) message = `🎉 Luar biasa, ${student.nama}! Pemahamanmu sangat baik.`;
  else if (score >= 75) message = `👍 Bagus, ${student.nama}! Pertahankan dan tingkatkan lagi.`;
  else if (score >= 60) message = `💪 Cukup baik, ${student.nama}. Pelajari kembali materi yang salah ya.`;
  else message = `📚 Jangan menyerah, ${student.nama}. Yuk belajar lagi materi TIK!`;
  msg.textContent = message;

  document.getElementById("quizSection").classList.add("hidden");
  document.getElementById("resultSection").classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ================= INIT ================= */
document.getElementById("identityForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const nama = document.getElementById("nama").value.trim();
  const absen = document.getElementById("absen").value.trim();

  if (!nama || !absen) {
    alert("Mohon isi nama dan nomor absen terlebih dahulu.");
    return;
  }

  student.nama = nama;
  student.absen = absen;

  document.getElementById("studentInfo").textContent =
    `👤 ${nama} — No. Absen: ${absen}`;

  document.getElementById("identitySection").classList.add("hidden");
  document.getElementById("quizSection").classList.remove("hidden");

  renderQuestions();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.getElementById("submitBtn").addEventListener("click", submitQuiz);
</script>
</body>
</html>
